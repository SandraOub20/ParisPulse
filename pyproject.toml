[project]
name = "parispulse"
version = "0.1.0"
description = "Observatoire prédictif des déplacements à vélo - projet étudiant"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.9,<4",
    "httpx>=0.28,<1",
    "pyyaml>=6,<7",
    "plotly>=6,<7",
    "folium>=0.19,<1",
    "streamlit>=1.45,<2",
    "streamlit-folium>=0.25,<1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.4,<5",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
dl = ["torch>=2.6,<3"]

[tool.uv]
package = false
required-version = ">=0.13.1,<0.14"

# Roues CPU sous Linux/Windows ; distribution standard sous macOS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "artifacts", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
